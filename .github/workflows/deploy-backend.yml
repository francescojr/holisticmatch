name: Deploy Backend to AWS EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'openapi.json'
      - 'openapi.yaml'
      - 'swagger-ui.html'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: False
          DATABASE_URL: sqlite:///test.db
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_BACKEND: resend.django.EmailBackend
        run: |
          pytest tests/ -v --tb=short
      
      - name: Trigger deployment via webhook
        run: |
          echo "🚀 Triggering deployment via webhook..."
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"ref":"refs/heads/main"}' \
            http://${{ secrets.EC2_HOST }}/webhook/deploy
          
          echo "✅ Webhook triggered successfully!"
          echo "🔄 Deployment running on EC2 in background..."
          sleep 2
            
            echo "→ Installing dependencies..."
            cd backend
            pip install -r requirements.txt --quiet
            
            echo "→ Running database migrations..."
            python manage.py migrate --noinput
            
            echo "→ Collecting static files..."
            python manage.py collectstatic --noinput --clear
            
            echo "→ Restarting Gunicorn..."
            sudo systemctl restart gunicorn
            
            sleep 3
            
            if sudo systemctl is-active --quiet gunicorn; then
              echo "✓ Gunicorn is active and running"
            else
              echo "✗ Gunicorn failed to start"
              sudo systemctl status gunicorn
              exit 1
            fi
            
            echo "→ Running API health check..."
      - name: Notify Success
        if: success()
        run: echo "✅ Backend deployment triggered successfully!"
      
      - name: Notify Failure
        if: failure()
        run: echo "❌ Webhook trigger failed!!"
