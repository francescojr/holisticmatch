name: Deploy Backend to AWS EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'openapi.json'
      - 'openapi.yaml'
      - 'swagger-ui.html'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: False
          DATABASE_URL: sqlite:///test.db
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_BACKEND: resend.django.EmailBackend
        run: |
          pytest tests/ -v --tb=short
      
      - name: Trigger deployment via webhook
        run: |
          python3 << 'EOF'
          import json
          import subprocess
          import sys
          
          webhook_data = json.dumps({"ref": "refs/heads/main"})
          
          result = subprocess.run([
              'curl', '-X', 'POST',
              '-H', 'Content-Type: application/json',
              '--data', webhook_data,
              'http://${{ secrets.EC2_HOST }}/webhook/deploy'
          ], capture_output=True, text=True, timeout=10)
          
          print("🚀 Webhook response:")
          print(result.stdout)
          
          if result.returncode != 0:
              print("❌ Webhook trigger failed!")
              print("Error:", result.stderr)
              sys.exit(1)
          
          print("✅ Webhook triggered successfully!")
          print("🔄 Deployment running on EC2 in background...")
          EOF
