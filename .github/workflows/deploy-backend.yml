name: Deploy Backend to AWS EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'openapi.json'
      - 'openapi.yaml'
      - 'swagger-ui.html'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: False
          DATABASE_URL: sqlite:///test.db
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_BACKEND: resend.django.EmailBackend
        run: |
          pytest tests/ -v --tb=short
      
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          command_timeout: 300s
          script: |
            set -e
            
            echo "========================================="
            echo "Starting backend deployment at $(date)"
            echo "========================================="
            
            cd /home/django/holisticmatch
            
            echo "→ Pulling latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "→ Activating virtual environment..."
            source backend/venv/bin/activate
            
            echo "→ Installing dependencies..."
            cd backend
            pip install -r requirements.txt --quiet
            
            echo "→ Running database migrations..."
            python manage.py migrate --noinput
            
            echo "→ Collecting static files..."
            python manage.py collectstatic --noinput --clear
            
            echo "→ Restarting Gunicorn..."
            sudo systemctl restart gunicorn
            
            sleep 3
            
            if sudo systemctl is-active --quiet gunicorn; then
              echo "✓ Gunicorn is active and running"
            else
              echo "✗ Gunicorn failed to start"
              sudo systemctl status gunicorn
              exit 1
            fi
            
            echo "→ Running API health check..."
            curl -f http://localhost/api/v1/professionals/ > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              echo "✓ API health check passed"
            else
              echo "⚠ API health check failed (non-blocking)"
            fi
            
            echo "========================================="
            echo "Backend deployment completed at $(date)"
            echo "========================================="
      
      - name: Notify Success
        if: success()
        run: echo "✅ Backend deployed successfully to AWS EC2!"
      
      - name: Notify Failure
        if: failure()
        run: echo "❌ Backend deployment to EC2 failed!!"
