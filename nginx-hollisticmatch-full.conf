# Redirect www to Vercel
server {
    listen 80;
    listen 443 ssl;
    server_name www.hollisticmatch.online;
    
    ssl_certificate /etc/letsencrypt/live/hollisticmatch.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hollisticmatch.online/privkey.pem;
    
    return 301 https://holisticmatch.vercel.app$request_uri;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name hollisticmatch.online;
    return 301 https://$host$request_uri;
}

# Main HTTPS server - API backend only
server {
    listen 443 ssl;
    server_name hollisticmatch.online;

    ssl_certificate /etc/letsencrypt/live/hollisticmatch.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hollisticmatch.online/privkey.pem;

    client_max_body_size 100M;

    # Redirect root to Vercel frontend
    location = / {
        return 301 https://holisticmatch.vercel.app;
    }

    # API endpoints
    location /api/v1/ {
        proxy_pass http://unix:/home/django/holisticmatch/backend/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "https://holisticmatch.vercel.app" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Webhook endpoint
    location /webhook/deploy {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Swagger/API docs
    location /docs {
        proxy_pass http://unix:/home/django/holisticmatch/backend/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /openapi.json {
        proxy_pass http://unix:/home/django/holisticmatch/backend/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else redirect to Vercel
    location / {
        return 301 https://holisticmatch.vercel.app$request_uri;
    }
}
